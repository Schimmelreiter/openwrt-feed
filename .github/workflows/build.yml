# Builds all packages of this feed with the official OpenWrt SDK
# and publishes them:
#   - as GitHub release "packages-<release>-<arch>" (rolling, replaced on
#     every push to main), for manual download and installation
#   - on the branch "packages" (bin/<release>/<arch>/...), so the feed can
#     also be fetched with plain git
name: Build packages

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - '.github/workflows/inspect.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.release }} ${{ matrix.arch }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          # Router "Link" (Linksys WRT1900ACS, mvebu)
          - arch: arm_cortex-a9_vfpv3-d16
            release: openwrt-25.12
            version: 25.12.6
            target: mvebu/cortexa9
            ext: apk
          # Access points (Cudy AP1300, ramips mt7621)
          - arch: mipsel_24kc
            release: openwrt-24.10
            version: 24.10.8
            target: ramips/mt7621
            ext: ipk

    # The SDK is downloaded directly instead of using openwrt/gh-action-sdk:
    # its containers fetch the SDK in setup.sh without a timeout, and that
    # step hung for more than 45 minutes.
    steps:
      - uses: actions/checkout@v4
        with:
          path: feed

      - name: Install host tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq build-essential clang flex bison g++ gawk \
            gcc-multilib g++-multilib gettext git libncurses-dev libssl-dev \
            python3-setuptools python3-dev rsync swig unzip zlib1g-dev file wget zstd

      # the SDK archive is cached; downloads.openwrt.org is sometimes slow and
      # stalls, so the download resumes (curl -C -) instead of restarting
      - name: Cache SDK
        uses: actions/cache@v4
        with:
          path: sdk-dl
          key: sdk-${{ matrix.version }}-${{ matrix.target }}

      - name: Download SDK
        timeout-minutes: 45
        run: |
          base="https://downloads.openwrt.org/releases/${{ matrix.version }}/targets/${{ matrix.target }}"
          mkdir -p sdk-dl && cd sdk-dl
          [ -s sha256sums ] || curl -fsSL --retry 5 --retry-delay 10 --max-time 120 -o sha256sums "$base/sha256sums"
          line=$(grep -E ' \*?openwrt-sdk-.*\.tar\.(zst|xz)$' sha256sums | head -n1)
          file=$(echo "$line" | sed 's/.* \*\{0,1\}//')
          echo "SDK: $file"
          check() { echo "$line" | sed 's/ \*/  /' | sha256sum -c --status -; }
          i=0
          until [ -s "$file" ] && check; do
            i=$((i + 1))
            [ $i -le 30 ] || { echo "::error::SDK download failed"; exit 1; }
            curl -fL -C - --speed-limit 50000 --speed-time 30 --max-time 600 \
              -o "$file" "$base/$file" || { echo "attempt $i interrupted, resuming"; sleep 5; }
            if [ -s "$file" ] && ! check && [ "$(stat -c %s "$file")" -ge "$(curl -fsIL "$base/$file" | tr -d '\r' | awk 'tolower($1)=="content-length:"{n=$2} END{print n+0}')" ]; then
              echo "checksum mismatch, downloading again"; rm -f "$file"
            fi
          done
          cd ..
          mkdir sdk
          tar -xf "sdk-dl/$file" -C sdk --strip-components=1

      - name: Feeds
        timeout-minutes: 20
        working-directory: sdk
        run: |
          sed -e 's,https://git.openwrt.org/feed/,https://github.com/openwrt/,' \
              -e 's,https://git.openwrt.org/openwrt/,https://github.com/openwrt/,' \
              -e 's,https://git.openwrt.org/project/,https://github.com/openwrt/,' \
              feeds.conf.default > feeds.conf
          echo "src-link schimmelreiter $GITHUB_WORKSPACE/feed" >> feeds.conf
          cat feeds.conf
          ./scripts/feeds update -a
          ./scripts/feeds install -p schimmelreiter -a
          make defconfig

      # Signing keys of the package feed (repository secrets). The public
      # halves are in keys/ of this repository. Without the secrets the SDK
      # signs with a new random key on every run, then the feed can only be
      # used without signature check.
      - name: Signing keys
        working-directory: sdk
        env:
          USIGN_KEY: ${{ secrets.USIGN_KEY }}
          APK_KEY: ${{ secrets.APK_KEY }}
        run: |
          if [ -n "$USIGN_KEY" ]; then
            printf '%s\n' "$USIGN_KEY" > key-build
            cp "$GITHUB_WORKSPACE/feed/keys/a3242c10f55446f3" key-build.pub
          else
            echo "::warning::secret USIGN_KEY missing, opkg index signed with a random key"
          fi
          if [ -n "$APK_KEY" ]; then
            printf '%s\n' "$APK_KEY" > private-key.pem
            cp "$GITHUB_WORKSPACE/feed/keys/schimmelreiter.pem" public-key.pem
          else
            echo "::warning::secret APK_KEY missing, apk index signed with a random key"
          fi
          chmod 600 key-build private-key.pem 2>/dev/null || true

      - name: Build
        timeout-minutes: 120
        working-directory: sdk
        run: |
          ret=0
          for p in llmnrd lltd wsdd2 samba36 luci-app-samba; do
            echo "::group::$p"
            make -j"$(nproc)" BUILD_LOG=1 IGNORE_ERRORS=1 CONFIG_AUTOREMOVE=y "package/$p/compile" || ret=1
            echo "::endgroup::"
          done
          make package/index V=s || true
          mv bin logs "$GITHUB_WORKSPACE"/ 2>/dev/null || true
          exit 0

      - name: Collect packages
        id: collect
        run: |
          src="bin/packages/${{ matrix.arch }}/schimmelreiter"
          out="dist/${{ matrix.release }}/${{ matrix.arch }}"
          mkdir -p "$out"
          ls -la "$src" || true
          cp -v "$src"/*.${{ matrix.ext }} "$out"/ 2>/dev/null || true
          cp -v "$src"/packages.adb "$src"/Packages* "$src"/index.json "$out"/ 2>/dev/null || true
          # build logs of failed packages, to make errors visible
          mkdir -p dist-logs
          [ -d logs ] && cp -r logs dist-logs/ || true
          ls -la "$out"

      - name: Check that every package was built
        run: |
          out="dist/${{ matrix.release }}/${{ matrix.arch }}"
          missing=0
          for p in $(find feed -name Makefile -path 'feed/*/*/Makefile' -print \
                     | xargs grep -h 'BuildPackage\|^LUCI_TITLE' | sed -n 's/.*BuildPackage,\([^)]*\)).*/\1/p'); do
            ls "$out"/"$p"[-_]*.${{ matrix.ext }} >/dev/null 2>&1 || { echo "::error::package $p was not built"; missing=1; }
          done
          for d in feed/luci/*/; do
            p=$(basename "$d")
            ls "$out"/"$p"[-_]*.${{ matrix.ext }} >/dev/null 2>&1 || { echo "::error::package $p was not built"; missing=1; }
          done
          if [ "$missing" = 1 ]; then
            for f in $(find dist-logs -name 'compile.txt'); do
              echo "::group::$f"; tail -n 150 "$f"; echo "::endgroup::"
            done
          fi
          exit "$missing"

      - name: Publish build logs (branch "logs")
        if: always()
        run: |
          [ -d dist-logs/logs ] || exit 0
          dir="logs-${{ matrix.release }}-${{ matrix.arch }}"
          git clone -q --depth 1 --branch logs "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" logrepo 2>/dev/null \
            || { mkdir logrepo && git -C logrepo init -q -b logs && git -C logrepo remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
          rm -rf "logrepo/$dir" && mkdir -p "logrepo/$dir"
          find dist-logs/logs -name 'compile.txt' | while read -r f; do
            t="logrepo/$dir/$(echo "$f" | sed 's|dist-logs/logs/||; s|/|_|g')"
            tail -n 400 "$f" > "$t"
          done
          cd logrepo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Build logs ${{ matrix.release }} ${{ matrix.arch }} (${{ github.sha }})" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin logs 2>/dev/null || true
            git push -q origin HEAD:logs && exit 0
            sleep 5
          done
          exit 1

      - name: Publish packages (branch "packages")
        if: github.event_name != 'pull_request'
        run: |
          git clone -q --depth 1 --branch packages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" pkgrepo 2>/dev/null \
            || { mkdir pkgrepo && git -C pkgrepo init -q -b packages && git -C pkgrepo remote add origin "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}"; }
          dir="pkgrepo/${{ matrix.release }}/${{ matrix.arch }}"
          rm -rf "$dir" && mkdir -p "$dir"
          cp -v dist/${{ matrix.release }}/${{ matrix.arch }}/* "$dir"/
          cd pkgrepo
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Packages ${{ matrix.release }} ${{ matrix.arch }} (${{ github.sha }})" || exit 0
          for i in 1 2 3; do
            git pull -q --rebase origin packages 2>/dev/null || true
            git push -q origin HEAD:packages && exit 0
            sleep 5
          done
          exit 1

      - name: Publish packages (release)
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag="packages-${{ matrix.release }}-${{ matrix.arch }}"
          files=$(ls dist/${{ matrix.release }}/${{ matrix.arch }}/*.${{ matrix.ext }} 2>/dev/null) || exit 0
          gh release delete "$tag" --yes --cleanup-tag 2>/dev/null || true
          gh release create "$tag" $files \
            --title "Packages for ${{ matrix.release }} (${{ matrix.arch }})" \
            --notes "Built from ${{ github.sha }} with the official OpenWrt SDK. Install with \`apk add --allow-untrusted <file>.apk\` (25.12) or \`opkg install <file>.ipk\` (24.10)."
