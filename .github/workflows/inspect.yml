# Temporary helper: fetches upstream sources/specs that are needed while
# developing the packages in this feed and stores excerpts as an artifact.
name: Inspect upstream sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Fetch sources and documents
        run: |
          set -x
          mkdir -p out
          sudo apt-get -qq update && sudo apt-get -qq install -y poppler-utils >/dev/null
          sudo apt-get -qq install -y zstd >/dev/null
          for n in wsdd2-2023.12.21~b676d8ac.tar.zst wsdd2-2023.12.21~b676d8ac.tar.xz; do
            curl -fsSL -o "$n" "https://sources.openwrt.org/$n" && break
          done
          ls -la wsdd2-* ; sha256sum wsdd2-* | tee out/wsdd2-netgear.sha256
          mkdir ng && tar -xf wsdd2-2023.12.21* -C ng --strip-components=1
          mkdir -p out/wsdd2-netgear && cp ng/*.c ng/*.h ng/Makefile out/wsdd2-netgear/ 2>/dev/null; ls -la ng > out/wsdd2-netgear/files.txt
          for u in "https://winprotocoldocs-bhdugrdyduf5h2e4.b02.azurefd.net/MS-LLTD/%5bMS-LLTD%5d.pdf" \
                   "https://winprotocoldoc.blob.core.windows.net/productionwindowsarchives/MS-LLTD/%5bMS-LLTD%5d.pdf" \
                   "https://download.microsoft.com/download/9/5/E/95EF66AF-9026-4BB0-A41D-A4F81802D92C/%5bMS-LLTD%5d.pdf"; do
            curl -fsSL -o lltd.pdf "$u" && [ -s lltd.pdf ] && { echo "got $u"; break; }
          done
          [ -s lltd.pdf ] && pdftotext -layout lltd.pdf out/MS-LLTD.txt || echo "MS-LLTD pdf not found" > out/MS-LLTD.txt
          ls -la out
      - name: Publish excerpts to the 'inspect' branch
        run: |
          cd out
          git init -q -b inspect
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Inspection results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect
