# Temporary helper: lists the available OpenWrt SDK container tags.
name: Inspect upstream sources

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: SDK container tags
        run: |
          mkdir -p out
          tok=$(curl -fsSL "https://ghcr.io/token?scope=repository:openwrt/sdk:pull" | python3 -c 'import json,sys; print(json.load(sys.stdin)["token"])')
          : > out/all-tags.txt
          last=""
          while :; do
            url="https://ghcr.io/v2/openwrt/sdk/tags/list?n=1000${last:+&last=$last}"
            curl -fsSL -H "Authorization: Bearer $tok" "$url" | python3 -c 'import json,sys; [print(t) for t in (json.load(sys.stdin).get("tags") or [])]' > page.txt
            [ -s page.txt ] || break
            cat page.txt >> out/all-tags.txt
            n=$(wc -l < page.txt); last=$(tail -n 1 page.txt)
            [ "$n" -lt 1000 ] && break
          done
          grep -E '^(mipsel_24kc|arm_cortex-a9_vfpv3-d16)-' out/all-tags.txt | sort -V > out/tags.txt
          wc -l out/all-tags.txt; cat out/tags.txt | tail -60
      - name: Publish to the 'inspect' branch
        run: |
          cd out
          git init -q -b inspect
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add -A && git commit -qm "Inspection results"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" inspect
